# Swing trade positions tracker
# Edit this file when you enter/exit/scale trades. Update fills_avg after each tranche.
#
# Currency notes:
#   - account_total_inr is your full net worth in INR for risk % calculations.
#   - usd_inr_rate is used to convert USD positions to INR for cross-sleeve risk math.

account:
  total_inr: 2750000          # ~27.5L total NW
  swing_sleeve_inr: 275000    # 10% of NW reserved for swings
  usd_inr_rate: 83.0          # update occasionally

# --- Closed trades (for journal / hit-rate tracking) ---
closed:
  - ticker: SNDK
    currency: USD
    entry_avg: 903.00
    exit_avg: ~                # update with actual exit price
    qty: 0.332
    result: profit
    notes: "Chased entry at 903. Exited at profit."

  - ticker: BSE.NS
    currency: INR
    entry_avg: 3303.00
    exit_avg: ~
    qty: 15
    result: profit
    notes: "Darvas breakout. Exited at profit."

  - ticker: CPRX
    currency: USD
    entry_avg: 28.00
    exit_avg: ~                # likely ~31.18 (M&A deal price 31.50)
    qty: 7
    result: profit
    notes: "Darvas retest entry. Angelini acquisition at $31.50 capped upside. Exited +11%."

# --- Active positions ---
positions:
  - ticker: ATHERENERG
    yf_symbol: ATHERENERG.NS
    currency: INR
    status: open
    entry_avg: 1003.00         # blended: 10K pilot + 50K add at ~1003
    qty: 59                    # ~11 pilot + 48 add
    capital: 60000
    stop: 960.00
    targets:
      - {price: 1100.00, pct_to_sell: 20, label: "T1 +9.7%"}
      - {price: 1200.00, pct_to_sell: 25, label: "T2 +19.6%"}
      - {price: 1350.00, pct_to_sell: 25, label: "T3 +34.6%"}
      - {price: 1500.00, pct_to_sell: 30, label: "T4 runner +49.6%"}
    time_stop_days: 7
    notes: "A-grade second-stage breakout on 2.75x vol. Minervini power play. Stop 960, move to BE after T2."

# Watchlist: not in position yet, just monitor for setup
watchlist:
  - ticker: STX
    yf_symbol: STX
    currency: USD
    trigger_buy_zone: [475, 510]
    trigger_stop: 448
